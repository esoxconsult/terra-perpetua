<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <title>Terra Perpetua</title>
  <!-- Simplified mark for small sizes (16-48 px): fewer, thicker layers, larger repository dot -->
