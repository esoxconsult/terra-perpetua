name: Validate data

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate perpetua.json (schema, coordinates, duplicate ids, country bounding boxes)
        run: node scripts/validate.mjs
      - name: Check that perpetua.csv matches perpetua.json
        run: node scripts/to-csv.mjs --check
