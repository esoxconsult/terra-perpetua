# Terra Perpetua: security headers and caching.
# Installed on the server as /etc/nginx/snippets/terraperpetua.conf and included
# in the "server" block of /etc/nginx/sites-enabled/terraperpetua.org.
#
# Note: add_header is NOT inherited by a location that sets its own add_header.
# The locations below therefore only use "expires" (no add_header), so the
# security headers apply to every response.

# ---------- Security headers ----------

# One year, no preload (preload is hard to undo).
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# Only own scripts, styles, fonts and data; images additionally from the OSM tile server
# and data: (Leaflet swaps in an empty data: GIF when it unloads tiles).
add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data: https://tile.openstreetmap.org; font-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; object-src 'none'" always;

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;

# OSM tile usage policy requires a valid Referer; this sends only the origin cross-site.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=(), usb=()" always;

# ---------- Compression ----------

# perpetua.json is ~700 KB raw, ~100 KB compressed. text/html is always compressed when gzip is on.
gzip on;
gzip_vary on;
gzip_types application/json application/javascript text/javascript text/css text/csv image/svg+xml;

# ---------- Caching ----------

# Default: browsers must revalidate (ETag / Last-Modified -> 304), so deploys are visible at once.
expires -1;

# Third-party code and fonts: folder names carry the version, safe to cache long.
location ^~ /vendor/ {
    expires 30d;
}

location ^~ /logos/ {
    expires 30d;
}
